upstream backend {
    # "backend" = the FastAPI container name in docker-compose
    server devshelf-backend:80;
}

server {
    listen 80;
    server_name _;

    # ── Frontend ──────────────────────────────────────────
    location / {
        # Serve React static files
        root /usr/share/nginx/html;
        index index.html;
        # try_files: try exact file → try directory → fallback to index.html
        # last part is critical for React Router (single page app)
        # without it, refreshing /bookmarks gives 404
        try_files $uri $uri/ /index.html;
    }

    # ── Backend API ───────────────────────────────────────
    location /api/ {
        # Forward all /api/* requests to FastAPI container
        proxy_pass http://backend;

        # Pass original request headers to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_read_timeout    60s;
    }

    # ── Health check endpoint ─────────────────────────────
    location /health {
        proxy_pass http://backend/health;
    }
}
